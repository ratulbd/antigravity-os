<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Filter for Central Glow -->
    <filter id="hubGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Card Masks for clean rounded borders -->
    <clipPath id="cardClip1">
      <rect width="470" height="130" rx="14"/>
    </clipPath>
    <clipPath id="cardClip2">
      <rect width="470" height="130" rx="14"/>
    </clipPath>
    <clipPath id="cardClip3">
      <rect width="470" height="130" rx="14"/>
    </clipPath>
    <clipPath id="cardClip4">
      <rect width="470" height="130" rx="14"/>
    </clipPath>
  </defs>

  <style>
    /* Clean Fonts */
    .hero-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; text-anchor: start; }
    .hero-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #94a3b8; text-anchor: start; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; text-anchor: start; }
    .card-meta { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; text-anchor: start; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; text-anchor: start; }
    .badge-txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    .footer-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; fill: #e2e8f0; text-anchor: start; }

    /* CSS Keyframe Animations - NO CSS TRANSFORMS ON TRANSLATED GROUPS! */
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.85; stroke-width: 1px; }
      50% { opacity: 1; stroke-width: 1.8px; }
    }
    @keyframes beaconRipple {
      0% { r: 4px; opacity: 1; }
      100% { r: 15px; opacity: 0; }
    }

    .animated-circuit {
      stroke-dasharray: 8 6;
      animation: circuitFlow 1.6s linear infinite;
    }
    .badge-glow {
      animation: glowPulse 2.4s ease-in-out infinite;
    }
    .beacon-anim {
      animation: beaconRipple 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1100" height="730" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Blueprint Background Tech Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="0.5">
    <line x1="50" y1="180" x2="1050" y2="180"/>
    <line x1="50" y1="365" x2="1050" y2="365"/>
    <line x1="50" y1="465" x2="1050" y2="465"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 48)">
    <text x="0" y="0" class="hero-title">Antigravity-OS: The 4-Pillar Synergy Architecture</text>
    <text x="0" y="24" class="hero-subtitle">Deterministic Non-Overlap Protocol across Specs, AST Graph, Episodic Memory &amp; Execution Runtime</text>
  </g>

  <!-- Active Status Beacon (Top Right with ample margin) -->
  <g transform="translate(860, 36)">
    <rect width="180" height="30" rx="8" fill="#0c1a24" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="20" cy="15" r="12" fill="#10b981" opacity="0.25" class="beacon-anim"/>
    <circle cx="20" cy="15" r="4.5" fill="#10b981"/>
    <text x="38" y="15" font-family="ui-monospace, monospace" font-size="11.5" font-weight="800" fill="#34d399" dominant-baseline="central" text-anchor="start">ACTIVE RUNTIME</text>
  </g>

  <!-- Animated Central Data Trunk -->
  <path d="M 550 120 L 550 455" stroke="#334155" stroke-width="2.5"/>
  <path d="M 550 120 L 550 455" stroke="#38bdf8" stroke-width="2" class="animated-circuit"/>

  <!-- Feed Lines to Cards -->
  <path d="M 520 185 L 550 185" stroke="#38bdf8" stroke-width="1.5" class="animated-circuit"/>
  <path d="M 550 185 L 580 185" stroke="#38bdf8" stroke-width="1.5" class="animated-circuit"/>
  <path d="M 520 345 L 550 345" stroke="#38bdf8" stroke-width="1.5" class="animated-circuit"/>
  <path d="M 550 345 L 580 345" stroke="#38bdf8" stroke-width="1.5" class="animated-circuit"/>

  <!-- Central Hub Node -->
  <g transform="translate(550, 265)">
    <circle cx="0" cy="0" r="22" fill="#0c1322" stroke="#38bdf8" stroke-width="2.5" filter="url(#hubGlow)"/>
    <circle cx="0" cy="0" r="16" fill="#1e293b"/>
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#38bdf8" font-weight="900" text-anchor="middle">⚡</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PILLAR 1: Prescriptive Specs (Top-Left) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 120)">
    <g clip-path="url(#cardClip1)">
      <rect width="470" height="130" fill="#0c1527" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="0" y="0" width="8" height="130" fill="url(#p1Grad)"/>
    </g>
    <text x="26" y="34" class="card-title">Pillar 1: Prescriptive Specifications</text>
    <text x="26" y="60" class="card-meta" fill="#60a5fa">Location: /docs/01_PRD.md → 06_Plan.md</text>
    <text x="26" y="86" class="card-desc">WHAT &amp; WHY to build: Design tokens, CSS contracts, API schemas.</text>
    <text x="26" y="108" class="card-desc" fill="#94a3b8">Prevents guessing architectural intent by reading raw source files.</text>

    <!-- Top-Right Badge (Pure SVG placement, no translate override) -->
    <rect x="345" y="18" width="108" height="24" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" class="badge-glow"/>
    <text x="399" y="30" class="badge-txt" fill="#bfdbfe">50–70% SAVINGS</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PILLAR 2: Structural AST Graph (Top-Right) -->
  <!-- ========================================================================= -->
  <g transform="translate(580, 120)">
    <g clip-path="url(#cardClip2)">
      <rect width="470" height="130" fill="#081d1a" stroke="#059669" stroke-width="1.5"/>
      <rect x="0" y="0" width="8" height="130" fill="url(#p2Grad)"/>
    </g>
    <text x="26" y="34" class="card-title">Pillar 2: Structural AST Graph</text>
    <text x="26" y="60" class="card-meta" fill="#34d399">Engine: codebase-memory-mcp (Tree-sitter + SQLite)</text>
    <text x="26" y="86" class="card-desc">HOW code is wired: Symbol call chains, callers, blast radius queries.</text>
    <text x="26" y="108" class="card-desc" fill="#94a3b8">Replaces 35,000-token file scans with 350-token graph traversal.</text>

    <!-- Top-Right Badge -->
    <rect x="345" y="18" width="108" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" class="badge-glow"/>
    <text x="399" y="30" class="badge-txt" fill="#a7f3d0">85–95% SAVINGS</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PILLAR 3: Episodic Session Memory (Bottom-Left) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 280)">
    <g clip-path="url(#cardClip3)">
      <rect width="470" height="130" fill="#140f26" stroke="#7c3aed" stroke-width="1.5"/>
      <rect x="0" y="0" width="8" height="130" fill="url(#p3Grad)"/>
    </g>
    <text x="26" y="34" class="card-title">Pillar 3: Episodic Session Memory</text>
    <text x="26" y="60" class="card-meta" fill="#a78bfa">Storage: Trail-Code (.trail/learnings/) + ai-memory</text>
    <text x="26" y="86" class="card-desc">WHAT failed &amp; was learned: Dead-ends, rejected hypotheses &amp; quirks.</text>
    <text x="26" y="108" class="card-desc" fill="#94a3b8">Stops the agent from repeating identical failed debugging trials.</text>

    <!-- Top-Right Badge -->
    <rect x="345" y="18" width="108" height="24" rx="6" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1" class="badge-glow"/>
    <text x="399" y="30" class="badge-txt" fill="#ddd6fe">60–80% SAVINGS</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PILLAR 4: Specialist Execution & Runtime Gates (Bottom-Right) -->
  <!-- ========================================================================= -->
  <g transform="translate(580, 280)">
    <g clip-path="url(#cardClip4)">
      <rect width="470" height="130" fill="#201509" stroke="#d97706" stroke-width="1.5"/>
      <rect x="0" y="0" width="8" height="130" fill="url(#p4Grad)"/>
    </g>
    <text x="26" y="34" class="card-title">Pillar 4: Execution &amp; Runtime Gates</text>
    <text x="26" y="60" class="card-meta" fill="#fbbf24">Engines: Gravitas (6 Invariants) + Ponytail (YAGNI)</text>
    <text x="26" y="86" class="card-desc">HOW code is executed: Write-scope locks &amp; fresh validator gates.</text>
    <text x="26" y="108" class="card-desc" fill="#94a3b8">Blocks premature 'fixed' claims until tests pass post-mutation.</text>

    <!-- Top-Right Badge -->
    <rect x="345" y="18" width="108" height="24" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1" class="badge-glow"/>
    <text x="399" y="30" class="badge-txt" fill="#fde68a">45% LESS CODE</text>
  </g>

  <!-- ========================================================================= -->
  <!-- FOUNDATION BANNER: Universal Discovery & Mechanical Enforcement Fabric   -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 450)">
    <rect width="1000" height="225" rx="16" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
    
    <text x="35" y="42" class="card-title" font-size="18">Universal Discovery &amp; Mechanical Enforcement Fabric</text>

    <g transform="translate(35, 72)">
      <circle cx="4" cy="-4" r="3.5" fill="#38bdf8"/>
      <text x="18" y="0" class="footer-desc">
        <tspan font-weight="700" fill="#38bdf8">503+ Specialized Skills</tspan> across 23 Canonical Repositories (Anthropic, Supabase, Vercel, Expo, Superpowers, etc.)
      </text>
    </g>
    <g transform="translate(35, 102)">
      <circle cx="4" cy="-4" r="3.5" fill="#f59e0b"/>
      <text x="18" y="0" class="footer-desc">
        <tspan font-weight="700" fill="#f59e0b">Gravitas Native Lifecycle Hooks</tspan> (PreToolUse write-scope barrier + Stop post-mutation validator gate)
      </text>
    </g>
    <g transform="translate(35, 132)">
      <circle cx="4" cy="-4" r="3.5" fill="#10b981"/>
      <text x="18" y="0" class="footer-desc">
        <tspan font-weight="700" fill="#10b981">Real-Time Token Ledger</tspan> &amp; Skill Attribution enforced across Antigravity, Gemini CLI, Claude Code, Cursor, Windsurf
      </text>
    </g>

    <!-- Three Roomy, Non-Truncated Badges with Absolute Coordinates -->
    <!-- Pill 1: Cross-Platform -->
    <g transform="translate(35, 160)">
      <rect width="320" height="36" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <text x="160" y="18" class="badge-txt" fill="#93c5fd" font-size="12">Cross-Platform: Windows • macOS • Linux</text>
    </g>

    <!-- Pill 2: Zero-Config Install -->
    <g transform="translate(380, 160)">
      <rect width="280" height="36" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="140" y="18" class="badge-txt" fill="#6ee7b7" font-size="12">Zero-Config 1-Command Install</text>
    </g>

    <!-- Pill 3: Skills & Repos -->
    <g transform="translate(685, 160)">
      <rect width="280" height="36" rx="8" fill="#3b0764" stroke="#7c3aed" stroke-width="1"/>
      <text x="140" y="18" class="badge-txt" fill="#d8b4fe" font-size="12">503 Skills • 23 Repositories</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgChart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Raw Agent Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <!-- Antigravity-OS Emerald Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shimmer for Progress Bars -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .chart-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .chart-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; fill: #94a3b8; }
    .scenario-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 700; fill: #f1f5f9; }
    .bar-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 700; dominant-baseline: central; }
    .savings-big { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 16px; font-weight: 900; fill: #34d399; text-anchor: middle; dominant-baseline: central; }
    .savings-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #a7f3d0; text-anchor: middle; letter-spacing: 0.5px; }
    .stat-pill-txt { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }

    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes barLoadA {
      0% { width: 0px; }
      100% { width: 620px; }
    }
    @keyframes barLoadB {
      0% { width: 0px; }
      100% { width: 550px; }
    }
    @keyframes barLoadC {
      0% { width: 0px; }
      100% { width: 460px; }
    }

    .badge-pulse {
      animation: pulseGlow 2.8s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1020" height="560" rx="18" fill="url(#bgChart)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="0.5">
    <line x1="50" y1="180" x2="970" y2="180"/>
    <line x1="50" y1="305" x2="970" y2="305"/>
    <line x1="50" y1="430" x2="970" y2="430"/>
  </g>

  <!-- Header -->
  <g transform="translate(50, 48)">
    <text x="0" y="0" class="chart-title">Empirical Token Benchmark: Raw Agent vs Antigravity-OS</text>
    <text x="0" y="24" class="chart-sub">Measured token consumption and cost reduction across common development scenarios</text>
    
    <!-- Verified Benchmark Chip -->
    <g transform="translate(770, -6)">
      <rect width="150" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#34d399"/>
      <text x="26" y="14" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" dominant-baseline="central">AUDITED DATA</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- SCENARIO A: Structural Symbol Discovery -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 105)">
    <text x="0" y="0" class="scenario-title">Scenario A: Structural Symbol Call-Chain Discovery</text>
    
    <!-- Red Bar (Raw Agent) -->
    <g transform="translate(0, 14)">
      <rect width="760" height="26" rx="6" fill="#151b2c"/>
      <rect width="640" height="26" rx="6" fill="url(#redGrad)"/>
      <text x="14" y="13" class="bar-label" fill="#ffffff">Raw Agent: ~32,000 tokens (5 Full Source Files Scanned)</text>
    </g>

    <!-- Green Bar (Antigravity-OS) -->
    <g transform="translate(0, 48)">
      <rect width="760" height="26" rx="6" fill="#151b2c"/>
      <rect width="18" height="26" rx="6" fill="url(#greenGrad)"/>
      <text x="28" y="13" class="bar-label" fill="#34d399">Antigravity-OS: ~350 tokens (AST Graph Query via codebase-memory-mcp)</text>
    </g>

    <!-- Savings Badge on Right -->
    <g transform="translate(780, 14)" class="badge-pulse">
      <rect width="140" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glow-badge)"/>
      <text x="70" y="23" class="savings-big">▼ 98.9%</text>
      <text x="70" y="44" class="savings-sub">TOKEN SAVINGS</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- SCENARIO B: Bug Investigation & Root-Cause Fix -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 225)">
    <text x="0" y="0" class="scenario-title">Scenario B: Complex Bug Investigation &amp; Root-Cause Fix</text>
    
    <!-- Red Bar (Raw Agent) -->
    <g transform="translate(0, 14)">
      <rect width="760" height="26" rx="6" fill="#151b2c"/>
      <rect width="570" height="26" rx="6" fill="url(#redGrad)"/>
      <text x="14" y="13" class="bar-label" fill="#ffffff">Raw Agent: ~28,500 tokens (3–4 Failed Trial-and-Error Cycles)</text>
    </g>

    <!-- Green Bar (Antigravity-OS) -->
    <g transform="translate(0, 48)">
      <rect width="760" height="26" rx="6" fill="#151b2c"/>
      <rect width="52" height="26" rx="6" fill="url(#greenGrad)"/>
      <text x="62" y="13" class="bar-label" fill="#34d399">Antigravity-OS: ~2,400 tokens (.trail/learnings/ + Gravitas Gate)</text>
    </g>

    <!-- Savings Badge on Right -->
    <g transform="translate(780, 14)" class="badge-pulse">
      <rect width="140" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glow-badge)"/>
      <text x="70" y="23" class="savings-big">▼ 91.5%</text>
      <text x="70" y="44" class="savings-sub">TOKEN SAVINGS</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- SCENARIO C: New Feature Implementation & Refactoring -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 345)">
    <text x="0" y="0" class="scenario-title">Scenario C: New Feature Endpoint &amp; Frontend View</text>
    
    <!-- Red Bar (Raw Agent) -->
    <g transform="translate(0, 14)">
      <rect width="760" height="26" rx="6" fill="#151b2c"/>
      <rect width="480" height="26" rx="6" fill="url(#redGrad)"/>
      <text x="14" y="13" class="bar-label" fill="#ffffff">Raw Agent: ~24,000 tokens (Unconstrained file writes &amp; drift)</text>
    </g>

    <!-- Green Bar (Antigravity-OS) -->
    <g transform="translate(0, 48)">
      <rect width="760" height="26" rx="6" fill="#151b2c"/>
      <rect width="84" height="26" rx="6" fill="url(#greenGrad)"/>
      <text x="96" y="13" class="bar-label" fill="#34d399">Antigravity-OS: ~4,100 tokens (Pillar 1 /docs + Ponytail YAGNI Filter)</text>
    </g>

    <!-- Savings Badge on Right -->
    <g transform="translate(780, 14)" class="badge-pulse">
      <rect width="140" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glow-badge)"/>
      <text x="70" y="23" class="savings-big">▼ 82.9%</text>
      <text x="70" y="44" class="savings-sub">TOKEN SAVINGS</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER STATS SUMMARY BANNER -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 465)">
    <rect width="920" height="52" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Stat 1 -->
    <g transform="translate(30, 26)">
      <circle cx="0" cy="0" r="4" fill="#34d399"/>
      <text x="14" y="0" class="stat-pill-txt" fill="#e2e8f0" text-anchor="start">
        Average Session Savings: <tspan fill="#34d399" font-weight="900">86.4% Fewer Tokens</tspan>
      </text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(390, 26)">
      <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
      <text x="14" y="0" class="stat-pill-txt" fill="#e2e8f0" text-anchor="start">
        Ponytail Filter: <tspan fill="#fbbf24" font-weight="900">▼ 53.3% Less Boilerplate LOC</tspan>
      </text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(720, 26)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
      <text x="14" y="0" class="stat-pill-txt" fill="#e2e8f0" text-anchor="start">
        Gravitas Gates: <tspan fill="#38bdf8" font-weight="900">Zero Unverified Claims</tspan>
      </text>
    </g>
  </g>
</svg>

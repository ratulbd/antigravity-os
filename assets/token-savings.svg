<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgChart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Raw Agent Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <!-- Antigravity-OS Emerald Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="badgeGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .chart-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; text-anchor: start; }
    .chart-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; fill: #94a3b8; text-anchor: start; }
    .scenario-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f1f5f9; text-anchor: start; }
    .bar-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 700; dominant-baseline: central; text-anchor: start; }
    .savings-big { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 16px; font-weight: 900; fill: #34d399; text-anchor: middle; dominant-baseline: central; }
    .savings-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #a7f3d0; text-anchor: middle; letter-spacing: 0.5px; dominant-baseline: central; }
    
    /* Dedicated Start-Aligned Class for Footer to prevent CSS inheritance bugs */
    .stat-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; fill: #e2e8f0; text-anchor: start; dominant-baseline: central; }

    /* CSS Animations - STRICTLY NO TRANSFORM ON GROUPS */
    @keyframes badgeGlowPulse {
      0%, 100% { opacity: 0.88; stroke-width: 1.2px; }
      50% { opacity: 1; stroke-width: 2px; }
    }
    .badge-glow {
      animation: badgeGlowPulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1060" height="580" rx="18" fill="url(#bgChart)" stroke="#1e293b" stroke-width="2"/>

  <!-- Blueprint Background Tech Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="0.5">
    <line x1="50" y1="185" x2="1010" y2="185"/>
    <line x1="50" y1="310" x2="1010" y2="310"/>
    <line x1="50" y1="435" x2="1010" y2="435"/>
  </g>

  <!-- Header -->
  <g transform="translate(50, 48)">
    <text x="0" y="0" class="chart-title">Empirical Token Benchmark: Raw Agent vs Antigravity-OS</text>
    <text x="0" y="24" class="chart-sub">Measured token consumption and cost reduction across common development scenarios</text>
  </g>

  <!-- Verified Benchmark Chip (Right Header) -->
  <g transform="translate(860, 36)">
    <rect width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#34d399"/>
    <text x="28" y="14" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" dominant-baseline="central" text-anchor="start">AUDITED DATA</text>
  </g>

  <!-- ========================================================================= -->
  <!-- SCENARIO A: Structural Symbol Discovery -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 105)">
    <text x="0" y="0" class="scenario-title">Scenario A: Structural Symbol Call-Chain Discovery</text>
    
    <!-- Red Bar (Raw Agent) -->
    <g transform="translate(0, 14)">
      <rect width="720" height="28" rx="6" fill="#151b2c"/>
      <rect width="630" height="28" rx="6" fill="url(#redGrad)"/>
      <text x="14" y="14" class="bar-label" fill="#ffffff">Raw Agent: ~32,000 tokens (5 Full Source Files Scanned)</text>
    </g>

    <!-- Green Bar (Antigravity-OS) -->
    <g transform="translate(0, 50)">
      <rect width="720" height="28" rx="6" fill="#151b2c"/>
      <rect width="20" height="28" rx="6" fill="url(#greenGrad)"/>
      <text x="32" y="14" class="bar-label" fill="#34d399">Antigravity-OS: ~350 tokens (AST Graph Query via codebase-memory-mcp)</text>
    </g>

    <!-- Savings Badge on Right (Absolute coordinates, no CSS translate reset) -->
    <g transform="translate(750, 14)" class="badge-glow">
      <rect width="150" height="64" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#badgeGlowFilter)"/>
      <text x="75" y="24" class="savings-big">▼ 98.9%</text>
      <text x="75" y="47" class="savings-sub">TOKEN SAVINGS</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- SCENARIO B: Bug Investigation & Root-Cause Fix -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 225)">
    <text x="0" y="0" class="scenario-title">Scenario B: Complex Bug Investigation &amp; Root-Cause Fix</text>
    
    <!-- Red Bar (Raw Agent) -->
    <g transform="translate(0, 14)">
      <rect width="720" height="28" rx="6" fill="#151b2c"/>
      <rect width="560" height="28" rx="6" fill="url(#redGrad)"/>
      <text x="14" y="14" class="bar-label" fill="#ffffff">Raw Agent: ~28,500 tokens (3–4 Failed Trial-and-Error Cycles)</text>
    </g>

    <!-- Green Bar (Antigravity-OS) -->
    <g transform="translate(0, 50)">
      <rect width="720" height="28" rx="6" fill="#151b2c"/>
      <rect width="54" height="28" rx="6" fill="url(#greenGrad)"/>
      <text x="66" y="14" class="bar-label" fill="#34d399">Antigravity-OS: ~2,400 tokens (.trail/learnings/ + Gravitas Gate)</text>
    </g>

    <!-- Savings Badge on Right -->
    <g transform="translate(750, 14)" class="badge-glow">
      <rect width="150" height="64" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#badgeGlowFilter)"/>
      <text x="75" y="24" class="savings-big">▼ 91.5%</text>
      <text x="75" y="47" class="savings-sub">TOKEN SAVINGS</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- SCENARIO C: New Feature Endpoint & Frontend View -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 345)">
    <text x="0" y="0" class="scenario-title">Scenario C: New Feature Endpoint &amp; Frontend View</text>
    
    <!-- Red Bar (Raw Agent) -->
    <g transform="translate(0, 14)">
      <rect width="720" height="28" rx="6" fill="#151b2c"/>
      <rect width="470" height="28" rx="6" fill="url(#redGrad)"/>
      <text x="14" y="14" class="bar-label" fill="#ffffff">Raw Agent: ~24,000 tokens (Unconstrained file writes &amp; drift)</text>
    </g>

    <!-- Green Bar (Antigravity-OS) -->
    <g transform="translate(0, 50)">
      <rect width="720" height="28" rx="6" fill="#151b2c"/>
      <rect width="86" height="28" rx="6" fill="url(#greenGrad)"/>
      <text x="98" y="14" class="bar-label" fill="#34d399">Antigravity-OS: ~4,100 tokens (Pillar 1 /docs + Ponytail YAGNI Filter)</text>
    </g>

    <!-- Savings Badge on Right -->
    <g transform="translate(750, 14)" class="badge-glow">
      <rect width="150" height="64" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#badgeGlowFilter)"/>
      <text x="75" y="24" class="savings-big">▼ 82.9%</text>
      <text x="75" y="47" class="savings-sub">TOKEN SAVINGS</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER STATS SUMMARY BANNER (100% Inside Container, No Clipped Text)      -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 475)">
    <!-- Container: 960px wide, centered in 1060px canvas (50px margins left & right) -->
    <rect width="960" height="56" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Stat 1: x=30 to x=320 -->
    <circle cx="30" cy="28" r="4.5" fill="#34d399"/>
    <text x="44" y="28" class="stat-text">
      Session Savings: <tspan fill="#34d399" font-weight="900">86.4% Fewer Tokens</tspan>
    </text>

    <!-- Stat 2: x=360 to x=640 -->
    <circle cx="360" cy="28" r="4.5" fill="#f59e0b"/>
    <text x="374" y="28" class="stat-text">
      Ponytail Filter: <tspan fill="#fbbf24" font-weight="900">▼ 53.3% Less LOC</tspan>
    </text>

    <!-- Stat 3: x=680 to x=940 (Safely before 960) -->
    <circle cx="680" cy="28" r="4.5" fill="#38bdf8"/>
    <text x="694" y="28" class="stat-text">
      Gravitas Gates: <tspan fill="#38bdf8" font-weight="900">100% Evidence-Backed</tspan>
    </text>
  </g>
</svg>
